<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="ti desc"><title id="ti">02-grammes-basis.svg</title><desc id="desc">Δύο σχηματικά τμήματα έντονα εσοχικής ακτής. Αριστερά κανονική γραμμή βάσης ακολουθεί τη ρηχία, δεξιά ευθείες γραμμές βάσης συνδέουν κατάλληλα σημεία της ακτής μόνο υπό τις προϋποθέσεις του άρθρου 7.</desc><defs><style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#102f4c}.label{font-size:21px;font-weight:bold}.sub{font-size:16px;fill:#365a76}.tiny{font-size:14px;fill:#31536c}.title{font-size:27px;font-weight:bold}.dash{stroke-dasharray:9 7}</style><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#0d547b" stroke-width="1.5"/></marker></defs><rect width="1120" height="480" rx="24" fill="#f7fbfe"/>
